[project]
name = "sino-africa-trade-intelligence"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 180
target-version = "py310"
extend-exclude = [".venv", "data", "database", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "E501", "E731", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
